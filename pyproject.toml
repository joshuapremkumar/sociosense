[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sociosense"
version = "0.2.0"
description = "Culturally grounded family outing planner built on Qloo"
requires-python = ">=3.10"
dependencies = []
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.scripts]
sociosense = "sociosense.cli:main"

[tool.setuptools.packages.find]
include = ["sociosense*"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
